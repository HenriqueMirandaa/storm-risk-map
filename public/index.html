<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Risco de tempestades em Portugal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #0e0f0d; --panel: #111310; --ink: #f2f1ea; --muted: #a7a89f;
      --faint: #73766e; --line: #2b2d28; --accent: #b84f6d;
      --low: #4d806a; --moderate: #c19b35; --high: #c96855; --extreme: #c7465d;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--paper); color: var(--ink); font: 14px/1.45 "Space Grotesk", sans-serif; }
    aside {
      position: fixed; z-index: 20; top: 0; right: 0; bottom: 0; width: 360px; max-width: calc(100vw - 24px);
      display: flex; flex-direction: column; gap: 28px; padding: 28px 24px 20px; overflow-y: auto;
      background: var(--panel); border-left: 1px solid var(--line);
      transform: translateX(0); opacity: 1;
      transition: transform 240ms cubic-bezier(.22, 1, .36, 1), opacity 180ms ease;
    }
    .panel-collapsed aside { pointer-events: none; transform: translateX(100%); opacity: 0; }
    .panel-header { display: flex; justify-content: flex-end; }
    .panel-toggle, .menu-toggle, .zoom-control button, .detail-close {
      border: 1px solid var(--line); border-radius: 5px; color: var(--muted); background: var(--panel);
      cursor: pointer; font: 600 11px/1 "Space Grotesk", sans-serif; letter-spacing: .06em; text-transform: uppercase;
      transition: color 160ms ease, border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
    }
    .panel-toggle { margin-left: auto; padding: 6px 8px; }
    .panel-toggle:hover, .panel-toggle:focus-visible, .detail-close:hover, .detail-close:focus-visible { color: var(--ink); border-color: var(--accent); outline: none; }
    button:active { transform: scale(.97); }
    h1 { max-width: 290px; margin: 24px 0 10px; font: 44px/.94 Anton, Impact, sans-serif; letter-spacing: -.015em; text-transform: uppercase; }
    .sub { max-width: 300px; margin: 0; color: var(--muted); font: 14px/1.55 "Space Grotesk", sans-serif; }
    h2 { margin: 0 0 12px; color: var(--faint); font: 16px/1 Anton, Impact, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    .legend { display: grid; gap: 10px; color: var(--muted); font-size: 13px; }
    .legend div { display: flex; align-items: center; gap: 9px; }
    .legend span { width: 8px; height: 8px; border-radius: 50%; }
    .lvl-low { background: var(--low); } .lvl-moderate { background: var(--moderate); }
    .lvl-high { background: var(--high); } .lvl-extreme { background: var(--extreme); }
    .foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11px; line-height: 1.55; }
    .foot a { color: var(--muted); }
    .map-wrap { position: relative; width: 100vw; height: 100vh; background: var(--paper); }
    #map { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; }
    .district { cursor: pointer; stroke: var(--line); stroke-width: 1.2; vector-effect: non-scaling-stroke; transition: fill .2s ease, stroke .2s ease, opacity .2s ease; }
    .district:hover { stroke: var(--ink); stroke-width: 2; filter: brightness(1.16); }
    .menu-toggle {
      position: absolute; z-index: 10; top: 20px; right: 20px; padding: 10px 14px;
      color: #0e0f0d; border-color: var(--accent); background: var(--accent);
    }
    .menu-toggle:hover, .menu-toggle:focus-visible { color: var(--ink); background: transparent; outline: none; }
    .zoom-control { position: absolute; z-index: 10; bottom: 24px; left: 24px; display: grid; gap: 4px; }
    .zoom-control button { width: 36px; height: 36px; color: var(--ink); font-size: 18px; }
    .zoom-control button:hover, .zoom-control button:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
    .district-detail {
      position: absolute; z-index: 11; left: 24px; bottom: 24px; width: 300px; padding: 18px;
      border: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--panel);
      opacity: 0; transform: translateY(12px); pointer-events: none;
      transition: opacity 180ms ease, transform 220ms cubic-bezier(.22, 1, .36, 1);
    }
    .district-detail.is-visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .detail-close { float: right; padding: 5px 7px; }
    .detail-kicker { margin-bottom: 5px; color: var(--accent); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .district-detail h2 { margin: 0 0 12px; color: var(--ink); font-size: 28px; }
    .detail-score { margin-bottom: 12px; font: 28px/1 Anton, Impact, sans-serif; }
    .detail-grid { display: grid; gap: 7px; color: var(--muted); font-size: 12px; }
    .detail-grid strong { color: var(--ink); font-weight: 500; }
    .detail-cities { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .detail-cities strong { display: block; margin-bottom: 3px; color: var(--ink); font-weight: 500; }
    .detail-warnings { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .detail-warnings strong { display: block; margin-bottom: 6px; color: var(--ink); font-weight: 500; }
    .warning-item + .warning-item { margin-top: 7px; }
    .warning-item b { color: var(--ink); font-weight: 500; }
    @media (max-width: 700px) {
      aside { width: 100%; max-width: none; padding: 22px 18px 16px; }
      h1 { font-size: 36px; }
      .menu-toggle { top: 12px; right: 12px; }
      .zoom-control { bottom: 16px; left: 16px; }
      .map-wrap, #map { height: 100svh; }
      .district-detail { right: 12px; bottom: 12px; left: 12px; width: auto; max-height: 44svh; overflow-y: auto; }
    }
  </style>
</head>
<body>
  <aside>
    <div>
      <div class="panel-header"><button class="panel-toggle" id="panelToggle" type="button" aria-expanded="true">Ocultar</button></div>
      <h1>Risco de tempestades em Portugal</h1>
    </div>
    <section>
      <h2>Escala de risco</h2>
      <div class="legend">
        <div><span class="lvl-low"></span>Baixo <small>0–24</small></div>
        <div><span class="lvl-moderate"></span>Moderado <small>25–49</small></div>
        <div><span class="lvl-high"></span>Alto <small>50–74</small></div>
        <div><span class="lvl-extreme"></span>Extremo <small>75–100</small></div>
      </div>
    </section>
    <div class="foot">
      Indicador experimental. Não substitui os avisos oficiais do <a href="https://www.ipma.pt/" target="_blank" rel="noreferrer">IPMA</a> ou da Proteção Civil.<br />
      Fontes: IPMA e Open-Meteo · geometria distrital derivada do CAOP
    </div>
  </aside>
  <main class="map-wrap">
    <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="true">Fechar menu</button>
    <svg id="map" role="application" aria-label="Mapa interativo de risco de tempestades em Portugal" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="zoom-control" aria-label="Zoom do mapa">
      <button id="zoomIn" type="button" aria-label="Aumentar zoom">+</button>
      <button id="zoomOut" type="button" aria-label="Diminuir zoom">−</button>
      <button id="zoomReset" type="button" aria-label="Ver Portugal inteiro">⌂</button>
    </div>
    <section class="district-detail" id="districtDetail" aria-live="polite">
      <button class="detail-close" id="detailClose" type="button" aria-label="Fechar detalhe">×</button>
      <div class="detail-kicker">Distrito selecionado</div>
      <h2 id="detailName"></h2>
      <div class="detail-score" id="detailScore"></div>
      <div class="detail-grid" id="detailWeather"></div>
      <div class="detail-cities" id="detailCities"></div>
      <div class="detail-warnings" id="detailWarnings"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
